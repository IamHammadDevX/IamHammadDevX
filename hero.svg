<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#07080B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0E14;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Top status bar -->
  <text x="30" y="35" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#4A5568">// biometric_scan.exe</text>
  
  <circle cx="1160" cy="25" r="4" fill="#38E1D8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1075" y="35" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#38E1D8">● LIVE</text>

  <!-- Divider line -->
  <line x1="30" y1="50" x2="1170" y2="50" stroke="#1C2230" stroke-width="1"/>

  <!-- Main content area -->
  <g>
    <!-- Left panel - Profile info -->
    <text x="50" y="110" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="bold" fill="#E7ECF3">HAMMAD</text>
    
    <text x="50" y="145" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38E1D8">DESIGNATION</text>
    <text x="50" y="165" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">Full-Stack AI/ML Engineer &amp;</text>
    <text x="50" y="182" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">Backend Systems Architect</text>

    <text x="50" y="220" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38E1D8">LOCATION</text>
    <text x="50" y="240" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">Pakistan</text>

    <text x="50" y="278" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38E1D8">AVAILABILITY</text>
    <text x="50" y="298" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">Freelance &amp; Remote Roles</text>

    <text x="50" y="336" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38E1D8">FOCUS</text>
    <text x="50" y="356" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">Web3 · AI/LLM · Full-Stack SaaS</text>
  </g>

  <!-- Right panel - Status indicators -->
  <g>
    <rect x="700" y="70" width="450" height="300" fill="none" stroke="#1C2230" stroke-width="1" rx="4"/>
    
    <text x="720" y="95" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4A5568">RECORD FOUND — SCANNING PROFILE</text>
    <line x1="720" y1="105" x2="1130" y2="105" stroke="#1C2230" stroke-width="1"/>

    <!-- Scanning animation -->
    <rect x="700" y="70" width="450" height="3" fill="#38E1D8" opacity="0.6">
      <animate attributeName="y" from="70" to="360" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Status boxes -->
    <g>
      <rect x="720" y="125" width="380" height="40" fill="#1C2230" rx="2" opacity="0.5"/>
      <text x="735" y="147" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38E1D8">STATUS</text>
      <text x="735" y="160" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#E7ECF3">ACTIVE · Remote @ Vughy Inc</text>

      <rect x="720" y="175" width="380" height="40" fill="#1C2230" rx="2" opacity="0.5"/>
      <text x="735" y="197" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38E1D8">EDUCATION</text>
      <text x="735" y="210" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#E7ECF3">CS Student · UET Lahore · Batch 2023</text>

      <rect x="720" y="225" width="380" height="40" fill="#1C2230" rx="2" opacity="0.5"/>
      <text x="735" y="247" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38E1D8">EXPERTISE</text>
      <text x="735" y="260" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#E7ECF3">Python · Solidity · React · FastAPI · Web3</text>

      <rect x="720" y="275" width="380" height="40" fill="#1C2230" rx="2" opacity="0.5"/>
      <text x="735" y="297" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38E1D8">CONNECT</text>
      <text x="735" y="310" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#E7ECF3">github.com/IamHammadDevX · linkedin.com/in/iamhammaddevx</text>
    </g>

    <!-- Blinking cursor -->
    <rect x="1120" y="125" width="3" height="12" fill="#38E1D8">
      <animate attributeName="opacity" values="1;0;1;0;1;0;1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Bottom status -->
  <text x="50" y="385" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#4A5568">scan complete — connection open ▌</text>
</svg>
