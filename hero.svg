<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#07080B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0E14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38E1D8;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#38E1D8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#38E1D8;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" fill="url(#bgGrad)"/>

  <!-- Top status bar -->
  <text x="20" y="28" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#4A5568">// biometric_scan.exe</text>
  
  <circle cx="1160" cy="18" r="4" fill="#38E1D8">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="1075" y="28" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#38E1D8">● LIVE</text>

  <!-- Divider line -->
  <line x1="20" y1="45" x2="1180" y2="45" stroke="#1C2230" stroke-width="1"/>

  <!-- Photo panel (left side) -->
  <g>
    <!-- Photo border frame -->
    <rect x="30" y="70" width="460" height="460" fill="none" stroke="#1C2230" stroke-width="2"/>
    
    <!-- Halftone photo -->
    <image x="30" y="70" width="460" height="460" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAVkAAAFZCAIAAAC9kMuMAABGR0lEQmlhY21ldHJpY19zY2FuLmV4ZQpDT05URVhUOiBWUzIwMjMuMTIuMTAgKDIxNzA2KSwgSW5mbyBEZXRlY3RlZApDQVNFU0VOU0lUSVZFOiBZRVMKUExBQ0VIREVSX1RSRVRDT0RFIEZBTFNFIG1haW4KVkVSU0lPTjogMS4wLjAuMApWRVJTSU9OX0NIPm8wMzEwMQ==" preserveAspectRatio="none"/>
    
    <!-- Grid overlay -->
    <g opacity="0.08" stroke="#38E1D8" stroke-width="0.5">
      <line x1="30" y1="107" x2="490" y2="107"/><line x1="30" y1="144" x2="490" y2="144"/><line x1="30" y1="181" x2="490" y2="181"/><line x1="30" y1="218" x2="490" y2="218"/>
      <line x1="30" y1="255" x2="490" y2="255"/><line x1="30" y1="292" x2="490" y2="292"/><line x1="30" y1="329" x2="490" y2="329"/><line x1="30" y1="366" x2="490" y2="366"/>
      <line x1="30" y1="403" x2="490" y2="403"/><line x1="30" y1="440" x2="490" y2="440"/><line x1="30" y1="477" x2="490" y2="477"/><line x1="30" y1="514" x2="490" y2="514"/>
    </g>

    <!-- Scanning sweep bar -->
    <rect x="30" y="70" width="460" height="8" fill="url(#scanGrad)" opacity="0.6">
      <animate attributeName="y" from="70" to="520" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Corner reticles -->
    <g stroke="#38E1D8" stroke-width="2" fill="none">
      <!-- Top-left -->
      <line x1="30" y1="70" x2="60" y2="70"/><line x1="30" y1="70" x2="30" y2="100"/>
      <!-- Top-right -->
      <line x1="490" y1="70" x2="460" y2="70"/><line x1="490" y1="70" x2="490" y2="100"/>
      <!-- Bottom-left -->
      <line x1="30" y1="530" x2="60" y2="530"/><line x1="30" y1="530" x2="30" y2="500"/>
      <!-- Bottom-right -->
      <line x1="490" y1="530" x2="460" y2="530"/><line x1="490" y1="530" x2="490" y2="500"/>
    </g>

    <!-- Match confirmed text -->
    <text x="260" y="560" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#38E1D8" text-anchor="middle" opacity="0">
      MATCH CONFIRMED — 97% CONFIDENCE
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
    </text>
  </g>

  <!-- Binary rain background (left margin) -->
  <g opacity="0.15" fill="#1C6B69" font-family="Consolas, 'Courier New', monospace" font-size="11">
    <text x="505" y="120" opacity="0">01010101<animate attributeName="opacity" from="0" to="0.3" dur="0.5s" begin="0s"/><animate attributeName="opacity" from="0.3" to="0" dur="0.5s" begin="3.5s"/></text>
    <text x="505" y="200" opacity="0">10101010<animate attributeName="opacity" from="0" to="0.25" dur="0.5s" begin="0.8s"/><animate attributeName="opacity" from="0.25" to="0" dur="0.5s" begin="4.3s"/></text>
    <text x="505" y="320" opacity="0">11001100<animate attributeName="opacity" from="0" to="0.2" dur="0.5s" begin="1.2s"/><animate attributeName="opacity" from="0.2" to="0" dur="0.5s" begin="4.7s"/></text>
    <text x="505" y="450" opacity="0">00110011<animate attributeName="opacity" from="0" to="0.35" dur="0.5s" begin="0.4s"/><animate attributeName="opacity" from="0.35" to="0" dur="0.5s" begin="3.9s"/></text>
  </g>

  <!-- Scanning percentage counter (top of data panel) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E7ECF3">
    <text x="600" y="105" opacity="0">SCANNING 0%<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.3s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur="0.1s" begin="0.6s" fill="freeze"/></text>
    <text x="600" y="105" opacity="0">SCANNING 22%<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.7s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur="0.1s" begin="1.0s" fill="freeze"/></text>
    <text x="600" y="105" opacity="0">SCANNING 48%<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.1s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur="0.1s" begin="1.4s" fill="freeze"/></text>
    <text x="600" y="105" opacity="0">SCANNING 71%<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.5s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur="0.1s" begin="1.8s" fill="freeze"/></text>
    <text x="600" y="105" opacity="0">SCANNING 90%<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.9s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur="0.1s" begin="2.2s" fill="freeze"/></text>
    <text x="600" y="105" opacity="0">COMPLETE 100%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.3s" fill="freeze"/></text>
  </g>

  <!-- Data readout panel -->
  <text x="600" y="130" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#4A5568">RECORD FOUND — DECRYPTING PROFILE</text>
  <line x1="600" y1="140" x2="1160" y2="140" stroke="#1C2230" stroke-width="1"/>

  <!-- Data rows (staggered fade-in) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11">
    <!-- NAME -->
    <text x="600" y="170" fill="#38E1D8" opacity="0" font-size="9" letter-spacing="1">NAME<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/></text>
    <text x="720" y="170" fill="#E7ECF3" opacity="0" font-size="12" font-weight="bold"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>Hammad</text>

    <!-- ROLE -->
    <text x="600" y="200" fill="#38E1D8" opacity="0" font-size="9" letter-spacing="1">ROLE<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/></text>
    <text x="720" y="200" fill="#E7ECF3" opacity="0" font-size="12"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>Full-Stack AI/ML &amp; Backend Architect</text>

    <!-- BACKGROUND -->
    <text x="600" y="230" fill="#38E1D8" opacity="0" font-size="9" letter-spacing="1">BACKGROUND<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/></text>
    <text x="720" y="230" fill="#E7ECF3" opacity="0" font-size="12"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>CS Student @ UET Lahore · Pakistan</text>

    <!-- FOCUS -->
    <text x="600" y="260" fill="#38E1D8" opacity="0" font-size="9" letter-spacing="1">FOCUS<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/></text>
    <text x="720" y="260" fill="#E7ECF3" opacity="0" font-size="12"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.0s" fill="freeze"/>Web3 · AI/LLM · Full-Stack SaaS</text>

    <!-- CLEARANCE -->
    <text x="600" y="290" fill="#38E1D8" opacity="0" font-size="9" letter-spacing="1">CLEARANCE<animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/></text>
    <text x="720" y="290" fill="#E7ECF3" opacity="0" font-size="12"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.5s" fill="freeze"/>Freelance &amp; Remote Roles</text>
  </g>

  <!-- Closing line with blinking cursor -->
  <text x="600" y="360" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#4A5568" opacity="0">scan complete — connection open<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.0s" fill="freeze"/></text>
  
  <rect x="985" y="350" width="3" height="12" fill="#38E1D8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1;0;1" dur="1.2s" begin="3.3s" repeatCount="indefinite"/>
  </rect>
</svg>
